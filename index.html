<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DreamNet Songs</title>
    <meta
      name="description"
      content="Original DreamNet song drops, ZABAL submissions, DreamStar experiments, and receipt-backed music pages."
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #07090d;
        --panel: rgba(18, 23, 31, 0.88);
        --line: rgba(255, 255, 255, 0.14);
        --text: #f6f0e8;
        --muted: #abb5c1;
        --gold: #ffd166;
        --pink: #ff5ca8;
        --cyan: #50e3ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 18% 14%, rgba(255, 92, 168, 0.18), transparent 28%),
          radial-gradient(circle at 84% 10%, rgba(80, 227, 255, 0.16), transparent 30%),
          linear-gradient(180deg, #07090d, #11141b 72%, #050609);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(1040px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      h1 {
        margin: 0;
        font-size: clamp(44px, 8vw, 92px);
        line-height: 0.9;
        letter-spacing: 0;
      }

      .eyebrow {
        color: var(--cyan);
        font-size: 13px;
        font-weight: 850;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .lead {
        max-width: 680px;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.55;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
        margin-top: 28px;
      }

      .card {
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        background: var(--panel);
      }

      .card img {
        display: block;
        width: 100%;
        aspect-ratio: 1.9;
        object-fit: cover;
      }

      .card-body {
        padding: 18px;
      }

      h2 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      p {
        color: var(--muted);
        line-height: 1.55;
      }

      a.button {
        display: inline-flex;
        min-height: 42px;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        padding: 0 14px;
        color: #07090d;
        background: linear-gradient(135deg, var(--gold), var(--pink));
        font-weight: 850;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">DreamStar catalog</p>
      <h1>DreamNet Songs</h1>
      <p class="lead">
        Original song drops, proof trails, ZABAL submissions, and music experiments. Each page is built to be linkable, remixable, and receipt-ready.
      </p>

      <section class="grid" aria-label="Song catalog">
        <article class="card">
          <img src="./songs/better-call-zaal/assets/better-call-zaal-cover.svg" alt="Better Call Zaal cover art" />
          <div class="card-body">
            <h2>Better Call Zaal</h2>
            <p>A polished ZABAL builder anthem generated in Suno and staged as a public song drop.</p>
            <a class="button" href="./songs/better-call-zaal/">Open song page</a>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
